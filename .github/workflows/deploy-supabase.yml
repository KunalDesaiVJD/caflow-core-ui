name: Deploy Supabase Edge Functions & Migrations

# BEST-EFFORT deploy. Every step is continue-on-error, so an expired/invalid
# SUPABASE_ACCESS_TOKEN (401) or a migration that needs a DB password is LOGGED
# but never fails the run — GitHub only emails a "workflow failed" notice when the
# run's conclusion is failure. To make the deploy actually execute, refresh the
# SUPABASE_ACCESS_TOKEN repo secret (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:   # manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        continue-on-error: true      # never fail the build (see header)
        run: npx supabase link --project-ref hubyywmodekfdzhwiumb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply pending migrations
        continue-on-error: true
        run: npx supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-notification function
        continue-on-error: true      # never fail the build (see header)
        run: |
          npx supabase functions deploy send-notification \
            --project-ref hubyywmodekfdzhwiumb \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy billing-reminders function
        continue-on-error: true      # never fail the build (see header)
        run: |
          npx supabase functions deploy billing-reminders \
            --project-ref hubyywmodekfdzhwiumb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy run-scrutiny-v2 function
        continue-on-error: true      # never fail the build (see header)
        run: |
          npx supabase functions deploy run-scrutiny-v2 \
            --project-ref hubyywmodekfdzhwiumb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── TDS on Property ──────────────────────────────────────────────────
      # Both read sale deeds and both import _shared/propertyExtract.ts, so
      # they are deployed together: changing the shared prompt without
      # redeploying BOTH leaves the two readers disagreeing about the same
      # page. property-agreement-extract-job additionally reads
      # _shared/aiProvider.ts and pdf-lib from esm.sh.
      - name: Deploy property-agreement-extract function
        continue-on-error: true      # never fail the build (see header)
        run: |
          npx supabase functions deploy property-agreement-extract \
            --project-ref hubyywmodekfdzhwiumb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy property-agreement-extract-job function
        continue-on-error: true      # never fail the build (see header)
        run: |
          npx supabase functions deploy property-agreement-extract-job \
            --project-ref hubyywmodekfdzhwiumb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Best-effort cleanup of the retired v1 engine. Safe to leave failing silently
      # (continue-on-error) once it's actually gone — nothing re-creates it.
      - name: Delete retired run-scrutiny (v1) function
        continue-on-error: true
        run: npx supabase functions delete run-scrutiny --project-ref hubyywmodekfdzhwiumb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
